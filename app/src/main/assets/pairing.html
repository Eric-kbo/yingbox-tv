<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>连接到映匣</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:system-ui,-apple-system,sans-serif;padding:32px 20px}main{max-width:480px;margin:auto}h1{font-size:30px;margin:8px 0 12px}p{color:#6e6e73;line-height:1.6;font-size:14px}.card{background:white;border-radius:18px;padding:24px;margin-top:24px}label{display:block;margin:18px 0 7px;font-size:14px}input,select{font:inherit;width:100%;border:1px solid #d2d2d7;border-radius:10px;padding:13px;background:white;color:#1d1d1f}input:focus,select:focus{outline:2px solid #0071e3;outline-offset:1px}button{font:inherit;width:100%;padding:14px;border:0;border-radius:11px;background:#0071e3;color:white;margin-top:24px;cursor:pointer}button:disabled{opacity:.55}details{margin-top:22px}summary{font-size:14px;cursor:pointer;color:#0071e3}#status{white-space:pre-line;margin-bottom:0}small{display:block;color:#6e6e73;margin-top:8px;line-height:1.5}.brand{font-size:13px;color:#86868b}input[type=password]{letter-spacing:.08em}
</style></head><body><main><div class="brand">映匣 · 电视资料库</div><h1>添加媒体源</h1><p>填写电脑、NAS 或 WebDAV 的连接信息。验证成功后，电视会自动保存。</p><form class="card" id="form">
<label for="kind">源类型</label><select id="kind" name="kind"><option value="SMB">电脑 / NAS 文件共享（SMB）</option><option value="WEBDAV">网络目录（WebDAV）</option></select>
<label for="address">共享地址</label><input id="address" name="address" required maxlength="2048" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="192.168.1.10/Photos"><small id="hint">填写设备 IP 和共享名，也可粘贴 Windows 的 \\设备\共享名。</small>
<label for="username">账号（可选）</label><input id="username" name="username" maxlength="2048" autocomplete="off" autocapitalize="none" spellcheck="false">
<label for="password">密码（可选）</label><input id="password" name="password" type="password" maxlength="2048" autocomplete="off">
<details><summary>名称与高级设置</summary><label for="name">显示名称（可选）</label><input id="name" name="name" maxlength="60" placeholder="默认使用文件夹名称"><label for="domain">域（可选）</label><input id="domain" name="domain" maxlength="2048" placeholder="一般留空" autocapitalize="none"></details>
<button id="submit">连接并保存到电视</button><p id="status" role="status" aria-live="polite"></p></form><p>手机与电视需在同一网络。电脑需先开启共享；二维码 10 分钟内有效，关闭电视添加页面后失效。</p></main>
<script>
const form=document.getElementById('form'),button=document.getElementById('submit'),status=document.getElementById('status');
document.getElementById('kind').onchange=e=>{let dav=e.target.value==='WEBDAV';document.getElementById('address').placeholder=dav?'https://example.com/dav/Photos/':'192.168.1.10/Photos';document.getElementById('hint').textContent=dav?'填写已开启 WebDAV 的完整目录地址。普通网页或网盘分享链接无法使用。':'填写设备 IP 和共享名，也可粘贴 Windows 的 \\\\设备\\共享名。'};
form.onsubmit=async e=>{e.preventDefault();button.disabled=true;status.style.color='#6e6e73';status.textContent='正在连接并读取文件目录，请稍等…';let done=false;try{const response=await fetch(location.pathname,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(form)).toString()});const text=await response.text();status.textContent=text;status.style.color=response.ok?'#248a3d':'#b3261e';if(response.ok){done=true;document.getElementById('password').value='';button.textContent='已保存，请查看电视';}}catch{status.textContent='无法连接电视。请确认两台设备在同一网络，并重新打开电视的添加页面。';status.style.color='#b3261e';}finally{button.disabled=done;}};
</script></body></html>
